name: ci-probe

on:
  workflow_dispatch:
  push:
    branches: [ci-probe]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report runner hardware
        run: |
          echo "nproc: $(nproc)"
          echo "--- /proc/cpuinfo model name ---"
          grep -m1 "model name" /proc/cpuinfo || true
          echo "--- free -h ---"
          free -h

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project (pins mirror the owner's local .venv exactly)
        run: |
          python -m pip install --upgrade pip
          pip install -e . "numpy==2.4.6" "numba==0.66.0" "llvmlite==0.48.0"
          echo "--- installed versions ---"
          pip freeze | grep -E -i '^(numpy|numba|llvmlite)=='
          python -V

      - name: Fast test suite
        run: |
          time python -m pytest -q -x --ignore=tests/test_exploiter_batched.py -k "not slow"

      - name: R0 block 0 run (25 deals, 4 workers, fast kernels)
        run: |
          time python experiments/run_exploit_eval.py --rows R0 --deals 25 --workers 4 --fast --out results/ci_probe_R0.txt

      - name: Bitwise comparison vs local reference
        run: |
          python ci/compare_bitwise.py | tee results/bitwise_verdict.txt
        continue-on-error: true

      - name: R1v single-deal timing (cold, includes JIT warmup)
        run: |
          time python experiments/run_exploit_eval.py --rows R1v --deals 1 --workers 1 --fast \
            --nested-size 20x5 --nested-plies 2 --nested-level VOIDS \
            --out results/ci_probe_R1v_cold.txt
          echo "--- cold report ---"
          cat results/ci_probe_R1v_cold.txt

      - name: R1v single-deal timing (warm, JIT already cached this process... rerun fresh deal)
        run: |
          rm -f results/exploit_R1v_partial.txt
          time python experiments/run_exploit_eval.py --rows R1v --deals 1 --workers 1 --fast \
            --nested-size 20x5 --nested-plies 2 --nested-level VOIDS \
            --out results/ci_probe_R1v_warm.txt
          echo "--- warm report ---"
          cat results/ci_probe_R1v_warm.txt

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-probe-results
          path: results/*
          if-no-files-found: warn
